# main에 푸시하면 Cloudflare Worker로 자동 배포합니다.
# 로컬에서 급히 올릴 때는 `npm run deploy`도 그대로 사용할 수 있습니다.
name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static student CSS
        run: npm run build:static

      # CI에서는 Sites timeout 래퍼 대신 vinext를 직접 호출합니다.
      - name: Build Worker
        run: npx vinext build

      - name: Apply D1 migrations
        id: migrate
        # Cloudflare 토큰에 D1 query 권한이 없으면 실패할 수 있습니다.
        # 실패 원인은 아래 필수 확인 단계에서 안내하며, 성공 전에는 배포하지 않습니다.
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # 계정 ID는 비밀이 아니라 워크플로에 둡니다. 토큰만 Secrets에 넣으면 됩니다.
          CLOUDFLARE_ACCOUNT_ID: "1944b9e709e1028976779c50cbbb13e1"
        run: npx wrangler d1 migrations apply DB --remote

      - name: Require successful D1 migrations
        if: steps.migrate.outcome != 'success'
        run: |
          echo "D1 migrations failed. Grant D1 query permission and rerun before deploying."
          exit 1

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # 계정 ID는 비밀이 아니라 워크플로에 둡니다. 토큰만 Secrets에 넣으면 됩니다.
          CLOUDFLARE_ACCOUNT_ID: "1944b9e709e1028976779c50cbbb13e1"
        run: npx wrangler deploy --config dist/server/wrangler.json
