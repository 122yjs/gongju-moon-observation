# main에 푸시하면 Cloudflare Worker로 자동 배포합니다.
# 로컬에서 급히 올릴 때는 `npm run deploy`도 그대로 사용할 수 있습니다.
name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Worker
        run: npm run build

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # 계정 ID는 비밀이 아니라 워크플로에 둡니다. 토큰만 Secrets에 넣으면 됩니다.
          CLOUDFLARE_ACCOUNT_ID: "1944b9e709e1028976779c50cbbb13e1"
        run: npx wrangler deploy --config dist/server/wrangler.json
