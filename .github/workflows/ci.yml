name: CI

# Public reusable workflow shared by the 122yjs repositories.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write
  checks: read
  statuses: read

jobs:
  call-reusable:
    uses: 122yjs/gha-reusable/.github/workflows/reusable-ci.yml@main
    with:
      # code-only Graphify (AST), not a documentation pass.
      run_graphify: true
      run_pr_conflicts: true
      node_version: "22"
      python_version: "3.12"
